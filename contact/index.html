<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — [YOUR_NAME]</title>
  <meta name="description" content="Get in touch with [YOUR_NAME]." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-nav"></header>

  <main id="main">
    <section class="wrap">
      <div class="section-head">
        <div>
          <p class="section-eyebrow">Contact</p>
          <h1>Let's talk</h1>
        </div>
      </div>

      <div class="contact-panel">
        <p data-reveal>
          Email me directly at
          <a id="contact-email" href="mailto:[YOUR_EMAIL]">[YOUR_EMAIL]</a>, or find me here:
        </p>
        <div id="contact-social" data-reveal></div>

        <form class="contact-form" id="contact-form" data-endpoint="[CONTACT_FORM_ENDPOINT]" data-reveal novalidate>
          <p class="visually-hidden">
            <label for="company">Company (leave blank)</label>
            <input id="company" name="company" type="text" tabindex="-1" autocomplete="off" />
          </p>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button class="btn btn--primary" type="submit">Send message</button>
          <p class="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script type="module" src="/src/pages/contact.js"></script>
</body>
</html>
